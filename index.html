/* PRODUCTS */

function showProducts(list=products){

const box=document.getElementById("products");

if(list.length===0){

box.innerHTML=
'<div class="empty">😔 सामान नहीं मिला</div>';

return;

}

box.innerHTML="";

list.forEach(p=>{

box.innerHTML+=`

<div class="product">

<img
src="${p.image}"
alt="${p.name}"
loading="lazy"
>

<h3>${p.name}</h3>

<div class="shop">
🏪 ${p.category}
</div>

<div class="weight">
${p.weight}
</div>

<div class="price">
₹${p.price}
</div>

<button
class="add"
onclick="addToCart(${p.id})"
>
🛒 Cart में डालें
</button>

</div>

`;

});

}


/* CART */

function addToCart(id){

const product=products.find(p=>p.id===id);

const old=cart.find(p=>p.id===id);

if(old){

old.qty++;

}else{

cart.push({
...product,
qty:1
});

}

updateCart();

alert(product.name+" Cart में जोड़ दिया गया ✅");

}


function updateCart(){

document.getElementById("cartCount").innerText=
cart.reduce((sum,p)=>sum+p.qty,0);

}


function openCart(){

document.getElementById("cartModal").style.display="flex";

showCart();

}


function closeCart(){

document.getElementById("cartModal").style.display="none";

}


function showCart(){

const box=document.getElementById("cartItems");

box.innerHTML="";

if(cart.length===0){

box.innerHTML=
'<div class="empty">🛒 Cart खाली है</div>';

document.getElementById("total").innerText=0;

return;

}

let total=0;

cart.forEach((p,index)=>{

const itemTotal=p.price*p.qty;

total+=itemTotal;

box.innerHTML+=`

<div class="cart-item">

<div>

<b>${p.name}</b><br>

₹${p.price} × ${p.qty}

</div>

<div class="qty">

<button onclick="decrease(${index})">
➖
</button>

<button onclick="increase(${index})">
➕
</button>

</div>

</div>

`;

});

document.getElementById("total").innerText=total;

}


function increase(index){

cart[index].qty++;

updateCart();

showCart();

}


function decrease(index){

cart[index].qty--;

if(cart[index].qty<=0){

cart.splice(index,1);

}

updateCart();

showCart();

}


/* SEARCH */

function searchProducts(){

const text=
document.getElementById("search").value.toLowerCase();

const result=products.filter(p=>
p.name.toLowerCase().includes(text)
);

showProducts(result);

}


/* CATEGORY */

function filterCategory(category){

if(category==="सब"){

showProducts(products);

return;

}

showProducts(
products.filter(p=>p.category===category)
);

}

alert("पहले सामान Cart में डालें 🛒");

return;

const name=
