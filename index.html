<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>MR – GAJENDRA KUMAR | Grocery</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7f5;color:#222;padding-bottom:70px}
header{background:#16a34a;color:white;padding:14px;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.profile{width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid white}
.brand h2{font-size:17px}.brand p{font-size:11px}
.cart{background:white;color:#15803d;border:0;border-radius:10px;padding:10px;font-size:20px}
.search{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;font-size:15px}
.banner{margin:15px;padding:20px;border-radius:16px;background:#dcfce7}
.banner h1{color:#15803d;font-size:21px;margin-bottom:6px}
.categories{display:flex;gap:10px;overflow-x:auto;padding:5px 15px 15px}
.category{min-width:82px;background:white;padding:11px 6px;border-radius:12px;text-align:center;box-shadow:0 2px 7px #0001;border:0}
.category span{font-size:24px;display:block;margin-bottom:4px}
.products{padding:0 15px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{background:white;border-radius:14px;padding:10px;box-shadow:0 2px 8px #0001}
.product-img{width:100%;height:115px;object-fit:cover;border-radius:10px}
.product h3{font-size:15px;margin-top:7px}
.weight{font-size:12px;color:#777;margin:4px 0}
.price{font-size:18px;font-weight:bold;color:#15803d}
.add{width:100%;margin-top:8px;padding:9px;border:0;border-radius:8px;background:#16a34a;color:white;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:9px;box-shadow:0 -2px 10px #0002;z-index:20}
.bottom button{border:0;background:none;font-size:11px}.bottom span{display:block;font-size:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:flex-end}
.modal-box{background:white;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.cart-item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #ddd}
.qty button{border:0;padding:5px 9px;margin-left:4px}
.total{font-size:20px;font-weight:bold;margin:15px 0}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
.order-btn{width:100%;padding:13px;border:0;border-radius:10px;background:#16a34a;color:white;font-size:16px;font-weight:bold;margin-top:7px}
.close{background:#eee;color:#222}
.empty{text-align:center;padding:25px;color:#777}
.shop-note{margin:15px;padding:12px;background:#fff7ed;border-radius:10px;font-size:13px}
</style>
</head>

<body>

<header>
<div class="top">
<div class="brand">
<img src="photo.jpg" class="profile" alt="MR Gajendra Kumar">
<div>
<h2>MR – GAJENDRA KUMAR</h2>
<p>आपका अपना Online Grocery Store</p>
</div>
</div>

<button class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</div>

<input id="search" class="search"
placeholder="🔍 सामान खोजें..."
oninput="searchProducts()">
</header>

<section class="banner">
<h1>🛒 घर बैठे सामान मंगाइए</h1>
<p>फल, सब्जी, राशन, दूध और रोजमर्रा का सामान एक ही जगह।</p>
</section>

<div class="categories">

<button class="category" onclick="filterCategory('all')">
<span>🛒</span>सब
</button>

<button class="category" onclick="filterCategory('fruit')">
<span>🍎</span>फल
</button>

<button class="category" onclick="filterCategory('vegetable')">
<span>🥬</span>सब्जी
</button>

<button class="category" onclick="filterCategory('grocery')">
<span>🍚</span>राशन
</button>

<button class="category" onclick="filterCategory('dairy')">
<span>🥛</span>दूध
</button>

<button class="category" onclick="filterCategory('other')">
<span>🧴</span>अन्य
</button>

</div>

<div class="shop-note">
🏪 <b>दुकानदार सिस्टम:</b>
अभी दुकानदारों के WhatsApp नंबर बाद में अनुमति लेकर जोड़े जाएँगे।
</div>

<div class="products" id="products"></div>

<div class="modal" id="cartModal">
<div class="modal-box">

<h2>🛒 आपका Cart</h2>
<div id="cartItems"></div>

<div class="total">
कुल: ₹<span id="total">0</span>
</div>

<h3>📦 Order की जानकारी</h3>

<input id="customerName" placeholder="आपका नाम">
<input id="customerPhone" placeholder="मोबाइल नंबर" type="tel">
<textarea id="address" placeholder="पूरा पता"></textarea>

<button class="order-btn" onclick="placeOrder()">
📲 WhatsApp पर Order भेजें
</button>

<button class="order-btn close" onclick="closeCart()">
बंद करें
</button>

</div>
</div>

<div class="bottom">
<button onclick="showProducts()"><span>🏠</span>Home</button>
<button onclick="filterCategory('fruit')"><span>🍎</span>फल</button>
<button onclick="filterCategory('vegetable')"><span>🥬</span>सब्जी</button>
<button onclick="filterCategory('grocery')"><span>🍚</span>राशन</button>
<button onclick="openCart()"><span>🛒</span>Cart</button>
</div>

<script>

const products = [

{
id:1,
name:"चीनी",
weight:"1 किलो",
price:50,
category:"grocery",
image:"https://images.unsplash.com/photo-1581268494057-5e6a7a1c3f8c?auto=format&fit=crop&w=500&q=80"
},

{
id:2,
name:"चावल",
weight:"5 किलो",
price:300,
category:"grocery",
image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80"
},

{
id:3,
name:"दाल",
weight:"1 किलो",
price:110,
category:"grocery",
image:"https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=500&q=80"
},

{
id:4,
name:"तेल",
weight:"1 लीटर",
price:150,
category:"grocery",
image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=500&q=80"
},

{
id:5,
name:"आलू",
weight:"1 किलो",
price:30,
category:"vegetable",
image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=500&q=80"
},

{
id:6,
name:"प्याज",
weight:"1 किलो",
price:35,
category:"vegetable",
image:"https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?auto=format&fit=crop&w=500&q=80"
},

{
id:7,
name:"टमाटर",
weight:"1 किलो",
price:40,
category:"vegetable",
image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=500&q=80"
},

{
id:8,
name:"सेब",
weight:"1 किलो",
price:120,
category:"fruit",
image:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=500&q=80"
},

{
id:9,
name:"केला",
weight:"1 दर्जन",
price:60,
category:"fruit",
image:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=500&q=80"
},

{
id:10,
name:"दूध",
weight:"1 लीटर",
price:60,
category:"dairy",
image:"https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=500&q=80"
},

{
id:11,
name:"दही",
weight:"500 ग्राम",
price:45,
category:"dairy",
image:"https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=500&q=80"
},

{
id:12,
name:"साबुन",
weight:"1 पीस",
price:35,
category:"other",
image:"https://images.unsplash.com/photo-1607006344380-b6775a0824a7?auto=format&fit=crop&w=500&q=80"
}

];

let cart=[];

function showProducts(list=products){

const box=document.getElementById("products");
box.innerHTML="";

if(list.length===0){
box.innerHTML='<div class="empty">😔 सामान नहीं मिला</div>';
return;
}

list.forEach(p=>{

box.innerHTML+=`

<div class="product">

<img src="${p.image}" class="product-img" alt="${p.name}">

<h3>${p.name}</h3>

<div class="weight">${p.weight}</div>

<div class="price">₹${p.price}</div>

<button class="add" onclick="addToCart(${p.id})">
🛒 Cart में डालें
</button>

</div>

`;

});

}

function addToCart(id){

const product=products.find(p=>p.id===id);
const existing=cart.find(p=>p.id===id);

if(existing){
existing.qty++;
}else{
cart.push({...product,qty:1});
}

updateCart();
alert(product.name+" Cart में जोड़ दिया गया ✅");

}

function updateCart(){

document.getElementById("cartCount").innerText=
cart.reduce((sum,p)=>sum+p.qty,0);

}

function openCart(){

document.getElementById("cartModal").style.display="flex";
showCart();

}

function closeCart(){

document.getElementById("cartModal").style.display="none";

}

function showCart(){

const box=document.getElementById("cartItems");
box.innerHTML="";

if(cart.length===0){
box.innerHTML='<div class="empty">🛒 आपका Cart खाली है</div>';
}

let total=0;

cart.forEach((p,index)=>{

total+=p.price*p.qty;

box.innerHTML+=`

<div class="cart-item">

<div>
<b>${p.name}</b><br>
₹${p.price} × ${p.qty}
</div>

<div class="qty">
<button onclick="decrease(${index})">➖</button>
<button onclick="increase(${index})">➕</button>
</div>

</div>

`;

});

document.getElementById("total").innerText=total;

}

function increase(index){

cart[index].qty++;
updateCart();
showCart();

}

function decrease(index){

cart[index].qty--;

if(cart[index].qty<=0){
cart.splice(index,1);
}

updateCart();
showCart();

}

function searchProducts(){

const text=document.getElementById("search").value.toLowerCase();

showProducts(
products.filter(p=>p.name.toLowerCase().includes(text))
);

}

function filterCategory(category){

if(category==="all"){
showProducts(products);
return;
}

showProducts(
products.filter(p=>p.category===category)
);

}

function placeOrder(){

if(cart.length===0){
alert("पहले सामान Cart में डालें 🛒");
return;
}

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("address").value.trim();

if(!name||!phone||!address){
alert("कृपया नाम, मोबाइल और पता भरें।");
return;
}

let message=
"🛒 *MR – GAJENDRA KUMAR ORDER*%0A%0A";

message+="👤 नाम: "+encodeURIComponent(name)+"%0A";
message+="📱 मोबाइल: "+encodeURIComponent(phone)+"%0A";
message+="📍 पता: "+encodeURIComponent(address)+"%0A%0A";

message+="📦 *सामान:*%0A";

let total=0;

cart.forEach(p=>{

const amount=p.price*p.qty;
total+=amount;

message+=
"• "+encodeURIComponent(p.name)+
" × "+p.qty+
" = ₹"+amount+"%0A";

});

message+="%0A💰 *कुल: ₹"+total+"*";

const ownerNumber="918102956584";

const whatsapp=
"https://wa.me/"+
ownerNumber+
"?text="+message;

window.open(whatsapp,"_blank");

}

showProducts();

</script>

</body>
</html>
