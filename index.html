<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#16a34a">
  <title>MR – GAJENDRA KUMAR | Online Grocery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7f5;
      color: #222;
    }

    header {
      background: #16a34a;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    .brand h2 {
      font-size: 18px;
    }

    .brand p {
      font-size: 12px;
      opacity: .9;
    }

    .cart {
      background: white;
      color: #16a34a;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 20px;
    }

    .search {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .banner {
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      background: #dcfce7;
    }

    .banner h1 {
      color: #15803d;
      font-size: 22px;
      margin-bottom: 7px;
    }

    .banner p {
      font-size: 14px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 5px 15px 15px;
    }

    .category {
      min-width: 90px;
      background: white;
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 7px #00000012;
    }

    .category span {
      font-size: 25px;
      display: block;
      margin-bottom: 5px;
    }

    .products {
      padding: 0 15px 90px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px #00000012;
    }

    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product h3 {
      font-size: 16px;
      margin-top: 8px;
    }

    .weight {
      color: #777;
      font-size: 12px;
      margin: 5px 0;
    }

    .price {
      color: #15803d;
      font-size: 18px;
      font-weight: bold;
    }

    .add {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-weight: bold;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      box-shadow: 0 -2px 10px #0002;
      z-index: 20;
    }

    .bottom button {
      border: none;
      background: none;
      font-size: 12px;
    }

    .bottom span {
      display: block;
      font-size: 21px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0008;
      z-index: 100;
      align-items: flex-end;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
    }

    .modal-box h2 {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .order-btn {
      width: 100%;
      padding: 13px;
      border: none;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .close {
      background: #eee;
      color: #222;
      margin-top: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div class="brand">
      <!-- आपकी फोटो -->
      <img src="photo.jpg" class="profile" alt="MR Gajendra Kumar">

      <div>
        <h2>MR – GAJENDRA KUMAR</h2>
        <p>आपका अपना Online Grocery Store</p>
      </div>
    </div>

    <button class="cart" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>

  </div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 सामान खोजें..."
    oninput="searchProducts()"
  >
</header>

<section class="banner">
  <h1>🛒 घर बैठे सामान मंगाइए</h1>
  <p>सब्जी, किराना और रोजमर्रा का सामान एक ही जगह।</p>
</section>

<div class="categories">
  <div class="category" onclick="filterCategory('all')">
    <span>🛒</span>सब
  </div>

  <div class="category" onclick="filterCategory('vegetable')">
    <span>🥔</span>सब्जी
  </div>

  <div class="category" onclick="filterCategory('grocery')">
    <span>🍚</span>किराना
  </div>

  <div class="category" onclick="filterCategory('fruit')">
    <span>🍎</span>फल
  </div>

  <div class="category" onclick="filterCategory('other')">
    <span>🧴</span>अन्य
  </div>
</div>

<div class="products" id="products"></div>

<!-- Cart Modal -->
<div class="modal" id="cartModal">

  <div class="modal-box">

    <h2>🛒 आपका Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
      कुल: ₹<span id="total">0</span>
    </div>

    <h3>📦 Order की जानकारी</h3>

    <input id="customerName" placeholder="आपका नाम">

    <input id="customerPhone" placeholder="मोबाइल नंबर" type="tel">

    <textarea id="address" placeholder="पूरा पता"></textarea>

    <button class="order-btn" onclick="placeOrder()">
      ✅ Order करें
    </button>

    <button
      class="order-btn close"
      onclick="closeCart()">
      बंद करें
    </button>

  </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom">

  <button onclick="window.scrollTo(0,0)">
    <span>🏠</span>
    Home
  </button>

  <button onclick="filterCategory('vegetable')">
    <span>🥬</span>
    सब्जी
  </button>

  <button onclick="filterCategory('grocery')">
    <span>🛍️</span>
    किराना
  </button>

  <button onclick="openCart()">
    <span>🛒</span>
    Cart
  </button>

</div>

<script>

const products = [

  {
    id: 1,
    name: "चीनी",
    weight: "1 किलो",
    price: 50,
    category: "grocery",
    image: "https://images.unsplash.com/photo-1581268494057-5e6a7a1c3f8c?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 2,
    name: "आलू",
    weight: "1 किलो",
    price: 30,
    category: "vegetable",
    image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 3,
    name: "प्याज",
    weight: "1 किलो",
    price: 35,
    category: "vegetable",
    image: "https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 4,
    name: "चावल",
    weight: "5 किलो",
    price: 300,
    category: "grocery",
    image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 5,
    name: "सेब",
    weight: "1 किलो",
    price: 120,
    category: "fruit",
    image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 6,
    name: "टमाटर",
    weight: "1 किलो",
    price: 40,
    category: "vegetable",
    image: "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 7,
    name: "दाल",
    weight: "1 किलो",
    price: 110,
    category: "grocery",
    image: "https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=500&q=80"
  },

  {
    id: 8,
    name: "तेल",
    weight: "1 लीटर",
    price: 150,
    category: "grocery",
    image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=500&q=80"
  }

];

let cart = [];

function showProducts(list = products) {

  const box = document.getElementById("products");

  box.innerHTML = "";

  if(list.length === 0) {

    box.innerHTML =
      '<div class="empty">😔 सामान नहीं मिला</div>';

    return;
  }

  list.forEach(p => {

    box.innerHTML += `

      <div class="product">

        <img
          src="${p.image}"
          class="product-img"
          alt="${p.name}"
        >

        <h3>${p.name}</h3>

        <div class="weight">
          ${p.weight}
        </div>

        <div class="price">
          ₹${p.price}
        </div>

        <button
          class="add"
          onclick="addToCart(${p.id})">

          🛒 Cart में डालें

        </button>

      </div>

    `;

  });

}

function addToCart(id) {

  const product = products.find(p => p.id === id);

  const existing = cart.find(p => p.id === id);

  if(existing) {

    existing.qty++;

  } else {

    cart.push({
      ...product,
      qty: 1
    });

  }

  updateCart();

  alert(product.name + " Cart में जोड़ दिया गया ✅");

}

function updateCart() {

  document.getElementById("cartCount").innerText =
    cart.reduce((sum, p) => sum + p.qty, 0);

}

function openCart() {

  document.getElementById("cartModal").style.display = "flex";

  showCart();

}

function closeCart() {

  document.getElementById("cartModal").style.display = "none";

}

function showCart() {

  const box = document.getElementById("cartItems");

  box.innerHTML = "";

  if(cart.length === 0) {

    box.innerHTML =
      '<div class="empty">🛒 आपका Cart खाली है</div>';

  }

  let total = 0;

  cart.forEach((p, index) => {

    const itemTotal = p.price * p.qty;

    total += itemTotal;

    box.innerHTML += `

      <div class="cart-item">

        <div>
          <b>${p.name}</b><br>
          ₹${p.price} × ${p.qty}
        </div>

        <div>
          <button onclick="decrease(${index})">➖</button>
          <button onclick="increase(${index})">➕</button>
        </div>

      </div>

    `;

  });

  document.getElementById("total").innerText = total;

}

function increase(index) {

  cart[index].qty++;

  updateCart();

  showCart();

}

function decrease(index) {

  cart[index].qty--;

  if(cart[index].qty <= 0) {

    cart.splice(index, 1);

  }

  updateCart();

  showCart();

}

function searchProducts() {

  const text =
    document.getElementById("search").value.toLowerCase();

  const result = products.filter(p =>
    p.name.toLowerCase().includes(text)
  );

  showProducts(result);

}

function filterCategory(category) {

  if(category === "all") {

    showProducts(products);

    return;

  }

  const result =
    products.filter(p => p.category === category);

  showProducts(result);

}

function placeOrder() {

  if(cart.length === 0) {

    alert("पहले सामान Cart में डालें 🛒");

    return;

  }

  const name =
    document.getElementById("customerName").value;

  const phone =
    document.getElementById("customerPhone").value;

  const address =
    document.getElementById("address").value;

  if(!name || !phone || !address) {

    alert("कृपया नाम, मोबाइल और पता भरें।");

    return;

  }

  let message =
    "🛒 *MR – GAJENDRA KUMAR ORDER*%0A%0A";

  message +=
    "👤 नाम: " + name + "%0A";

  message +=
    "📱 मोबाइल: " + phone + "%0A";

  message +=
    "📍 पता: " + address + "%0A%0A";

  message += "📦 सामान:%0A";

  let total = 0;

  cart.forEach(p => {

    message +=
      "• " + p.name +
      " × " + p.qty +
      " = ₹" +
      (p.price * p.qty) +
      "%0A";

    total += p.price * p.qty;

  });

  message +=
    "%0A💰 कुल: ₹" + total;

  /*
    यहाँ अपना WhatsApp नंबर डालें।
    उदाहरण:
    919876543210
  */

  const ownerNumber = "91XXXXXXXXXX";

  const whatsapp =
    "https://wa.me/" +
    ownerNumber +
    "?text=" +
    message;

  window.open(whatsapp, "_blank");

}

showProducts();

</script>

</body>
  </html>
